[project]
name = "capstone-backend"
version = "0.1.0"
description = "음원 기반 악기 분리·타브 생성 및 카피 보조 웹서비스 백엔드"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "boto3>=1.34",
]

[dependency-groups]
ai = [
    "audio-separator>=0.47.1",
    "audioread>=3.1.0",
    "basic-pitch>=0.4.0",
    "beat-this>=1.1.0",
    "librosa>=1.0.0",
    "music21>=10.5.0",
    "onnxruntime>=1.31.0",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "httpx>=0.27",
    "boto3-stubs[s3]>=1.34",
    "celery-types>=0.22",
    "mir-eval>=0.8.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]
override-dependencies = [
    # basic-pitch 0.4.0은 Py3.11+에서 TF<2.15.1을 요구하지만 Py3.12용 TF가 없음 → ONNX로 실행하므로 제거
    "tensorflow ; sys_platform == 'never'",
    "tensorflow-macos ; sys_platform == 'never'",
    # basic-pitch(resampy<0.4.3)와 audio-separator 충돌 해소
    "resampy>=0.2.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
# audio-separator → onnx2torch가 끌어옴. PyPI 리눅스 휠은 CUDA 빌드라 CPU torch와 맞춤
torchvision = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = [
    "B008",   # FastAPI Depends() 기본값 패턴 허용
    "N818",   # BusinessException 이름 유지 (노션 컨벤션)
    "UP046",  # Pydantic 제네릭 모델은 Generic[T] 방식 유지
]

[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["basic_pitch.*", "beat_this.*", "audio_separator.*", "music21.*", "librosa.*",
          "soundfile.*", "torch.*", "torchaudio.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
